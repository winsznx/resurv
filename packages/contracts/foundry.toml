[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]

# Pinned at scaffold time. See docs/VERSIONS.md for the resolution record.
solc = "0.8.36"

# Base Sepolia supports Cancun. Pinned explicitly rather than inherited from the compiler
# default, so a solc upgrade cannot silently change the emitted opcode set.
evm_version = "cancun"

optimizer = true
optimizer_runs = 200
via_ir = false

# Deterministic artifacts: metadata hashes otherwise vary per machine and break the
# runtime-bytecode comparison used in the proof ladder.
bytecode_hash = "none"
cbor_metadata = false

# No filesystem access from tests or scripts unless a later phase justifies it.
fs_permissions = []

deny = "warnings"

# Our own source must compile clean. OpenZeppelin 5.6.1 uses `error` as an identifier in
# `ECDSA.sol`, which solc 0.8.36 warns about because it is becoming a keyword. That is the
# audited release npm ships as `latest` (see docs/VERSIONS.md) and it is not ours to patch, so
# warnings originating in `lib` are excluded by path rather than by error code. Excluding the
# code would have silenced the same warning in our own contracts.
ignored_warnings_from = ["lib"]

[profile.default.fuzz]
runs = 512
max_test_rejects = 100000

[profile.default.invariant]
runs = 256
# Raised from 64 when the covenant handler landed. Nine handler entry points at depth 64 gave
# roughly seven calls each per run, and a covenant needs create, fund, trigger and attempt in
# that order before anything interesting can happen. The measured effect is in the phase log:
# successful attempts per run went from zero to a number worth reporting.
depth = 128
# The handler has no legitimate revert path, so a revert is a defect rather than noise. The
# Phase 0 independent review flagged `false` as a trap that would silently swallow every
# `require` once a handler wraps a real stateful contract.
fail_on_revert = true
call_override = false

# CI turns the dials up. Used by .github/workflows/ci.yml.
[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 1000
depth = 128
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
