name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turns the fuzz and invariant dials up. See [profile.ci] in packages/contracts/foundry.toml.
  FOUNDRY_PROFILE: ci

jobs:
  workspace:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This job was named `javascript` and installed no Foundry toolchain and no submodules,
      # which made it impossible on a clean runner: `pnpm typecheck` fans out to
      # contracts#typecheck (forge build --sizes), `pnpm test` to contracts#test (forge test),
      # `pnpm build` to contracts#build, and `pnpm lint` to contracts#lint (forge fmt --check).
      # Those four commands are cross-stack by design, so the job that runs them installs the
      # whole toolchain. Which commands need Foundry is derived from the script graph in
      # packages/repo-policy/test/ci-workflow.test.ts, not from a list kept by hand here.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile fails if the lockfile does not match package.json, which is what
      # keeps a dependency from drifting in without a reviewed change.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm build

  contracts:
    name: forge fmt, build, test, invariant
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      # Foundry dependencies are pinned git submodules, so a shallow checkout without them
      # produces a build that fails on a missing forge-std rather than on our code.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # These four are the bodies of contracts#lint, contracts#typecheck, contracts#test and
      # contracts#test:invariant. Run directly so a Solidity failure is attributed to this job
      # rather than to a turbo task inside the workspace job.
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
      - run: forge test --match-path 'test/invariant/*' -vv

  policy:
    name: no secrets in the tree, no permission bypass, no script drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a file that was committed and later ignored is still a leak, and a
      # shallow clone cannot see it. The detector reports a shallow clone rather than
      # passing quietly, so this depth is load-bearing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @resurv/repo-policy owns four checks: the tracked-secret detector (with fixtures for
      # every category .gitignore protects), the Claude Code permission boundary regression
      # tests, the credential-surface tests, and the auto-approved script graph. It installs no
      # Foundry toolchain because none of its commands reach one, which the CI policy test
      # asserts rather than assumes. See docs/THREAT_MODEL.md T6, T10, T11, T13 and T14.
      - run: pnpm --filter @resurv/repo-policy test

  gate:
    name: repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [workspace, contracts, policy]
    # Runs even when a dependency failed, so the aggregate result is always reported rather
    # than skipped. This is the single job to require on a branch protection rule.
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
