<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESURV — proof of one outcome covenant</title>
    <meta
      name="description"
      content="An outcome covenant that ran on Base Sepolia. The primary recovery action was refused before broadcast, the approved fallback executed through KeeperHub, and one transaction carries the action, the verifier result, the state transition and the fee."
    />
    <meta name="color-scheme" content="light" />
    <!--
      The symbol is the product drawn once: a path that steps down and terminates in a single
      accent square. `#FF5A00` appears exactly twice on this whole site — here, and on the one
      timeline beat that was refused before broadcast.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og.png" />
    <meta name="theme-color" content="#F4F4F5" />
    <!--
      design.md names Cosmica with DM Sans as the substitute. Cosmica is not licensed to this
      project, so DM Sans is the face that actually ships. Loaded with `display=swap` and a
      preconnect: if fonts.googleapis.com is unreachable the page renders in the system stack
      and loses nothing but the typographic register.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
    />
    <meta property="og:title" content="RESURV — proof of one outcome covenant" />
    <meta
      property="og:description"
      content="The transaction landed. That was never the question. Read the covenant, the refused primary action, the fallback, and the six logs of the transaction that paid the responder."
    />
    <meta property="og:type" content="website" />
    <!--
      Absolute, not relative. X and several other crawlers refuse to resolve a relative
      `og:image`, and a card that silently fails to unfurl is worse than no card. The domain is
      known now that the Worker is published.
    -->
    <meta property="og:url" content="https://resurv-production.timjosh507.workers.dev" />
    <meta property="og:image" content="https://resurv-production.timjosh507.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RESURV. Outcome, not attempt. Pre-authorized recovery execution that advances only on chain evidence." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://resurv-production.timjosh507.workers.dev/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
